name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0-dev' }
          # Self-contained single file: runs without installing the .NET runtime.
          dotnet publish src/Glint/Glint.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$v -o publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Glint.exe -DestinationPath Glint-win-x64.zip -Force
          Copy-Item publish/Glint.exe Glint.exe
          (Get-FileHash Glint.exe, Glint-win-x64.zip -Algorithm SHA256) |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glint-win-x64
          path: |
            Glint.exe
            Glint-win-x64.zip
            SHA256SUMS.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Glint.exe
            Glint-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
